name: Lint
on: [ pull_request ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: flake8 install
        run: pip3 install flake8
      - name: lint
        run: flake8 fastapi_router_controller/